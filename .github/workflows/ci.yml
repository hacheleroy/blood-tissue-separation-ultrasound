name: Numerical and package verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested.txt
      # The historical local freeze included six uncommitted setuptools files.
      # Check all committed phase-11 sources and outputs in this clean checkout.
      - run: python scripts/verify_esdiva_phase11_checkout.py
      - run: python scripts/verify_axis1_motion_order.py
      - run: python scripts/verify_axis1_native_subtraction.py
      - run: python scripts/verify_axis1_stable_tissue.py
      - run: python scripts/verify_axis1_oracle_limit.py
      - if: matrix.python == '3.12'
        run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install -e '.[test,io]'
      - run: python -m pytest -q -ra
      - run: python scripts/verify_results.py
      - run: python scripts/verify_results.py --manifest runs/followup_v04_manifest.json
      - run: python scripts/verify_results.py --manifest runs/shared_v05_manifest.json
      - run: python scripts/verify_shared_results.py
      # Later Axis 1 modules have separate frozen source leases.
      - run: python scripts/verify_results.py --manifest runs/motion_v06_manifest.json --require-current-code --exclude-current-source motion_first.py --exclude-current-source native_subtraction.py --exclude-current-source stable_tissue.py --exclude-current-source multidim.py --exclude-current-source esdiva_aperture.py --exclude-current-source rpca_comparators.py
      - run: python scripts/verify_motion_results.py
      # v07 hashed the entire then-existing btbench folder. Temporarily hide
      # the later modules so the original source/protocol check remains
      # exact, then restore it even if verification raises.
      - name: Verify historical v07 phantom freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          modules = [Path('src/btbench/motion_first.py'),
                     Path('src/btbench/native_subtraction.py'),
                     Path('src/btbench/stable_tissue.py'),
                     Path('src/btbench/multidim.py'),
                     Path('src/btbench/esdiva_aperture.py'),
                     Path('src/btbench/rpca_comparators.py')]
          with TemporaryDirectory() as temp:
              held = []
              try:
                  for module in modules:
                      destination = Path(temp) / module.name
                      module.rename(destination)
                      held.append((module, destination))
                  subprocess.run(['python', 'scripts/phantom_v07.py', 'check-protocol'], check=True)
              finally:
                  for module, destination in reversed(held):
                      destination.rename(module)
          PY
      - run: python scripts/verify_resolvestroke_single_view.py
      - run: python scripts/verify_resolvestroke_spatial_audit.py
      - run: python scripts/verify_phantom_phase10_dryrun.py
      - run: python scripts/verify_esdiva_phase10_stress.py
      - run: python scripts/verify_esdiva_phase11_development.py
      - run: python scripts/verify_multidim_aperture.py --measured runs/resolvestroke_aperture_pilot_v1/report.json
      - run: python scripts/verify_flow_background_audit.py
      - run: python scripts/verify_receive_core_source_profile.py
      - run: python scripts/verify_transport_lag_historical_checkout.py
      - run: python scripts/verify_transport_lag_physical.py
      - run: python scripts/phantom_phase10_preflight.py plan --card runs/phantom_phase10_plan/acquisition_card.json --inventory runs/phantom_phase10_plan/capture_inventory.json
      - run: python scripts/phantom_phase10_dryrun.py --plan-directory runs/phantom_phase10_plan --fixture-directory ${{ runner.temp }}/phase10_fixture --output ${{ runner.temp }}/phase10_fixture_report.json

  packages:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/verify_artifacts.py dist
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps dist/*.whl
      - name: Installed wheel smoke test outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import btbench
          from btbench.synthetic import poiseuille
          from btbench.benchmark import run_benchmark
          assert btbench.__version__ == '0.5.0'
          a=poiseuille(n_frames=32,shape=(4,7))
          r=run_benchmark(a,{'methods':[{'id':'svd','method':'svd'}]},'wheel_smoke')
          assert r['results'][0]['status']=='ok'
          assert r['results'][0]['metrics']['frozen_component_metrics_available']
          from btbench.shared import shared_scene, SharedContext, fit_shared
          a=shared_scene(n_frames=32,calibration_frames=16,shape=(4,8))
          c=SharedContext(a.public,packet=16,score_start=16)
          assert fit_shared(c,{'method':'axis1','horizon':16,'discard':1}).views.shape == (16,3,4,8)
          PY
      - name: Verify tests from the source distribution
        run: |
          python - <<'PY'
          import pathlib,tarfile,subprocess,tempfile
          with tempfile.TemporaryDirectory() as tmp:
              with tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))) as f:
                  f.extractall(tmp,filter='data')
              root=next(pathlib.Path(tmp).iterdir())
              subprocess.run(['python','-m','pytest','-q','-ra'],cwd=root,check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-packages
          path: dist/*
