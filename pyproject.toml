[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-tissue-benchmark"
version = "0.1.0"
description = "CPU reference benchmark for complex-IQ blood/tissue separation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "threadpoolctl>=3"]

[project.optional-dependencies]
io = ["h5py>=3.9", "fsspec[http]>=2024.2", "hdf5plugin>=4"]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[project.scripts]
btbench = "btbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
